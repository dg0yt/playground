on:
  workflow_dispatch:

jobs:
  my_job:
    name: test job
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
    - name: run script
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view my-release --json assets || {
          gh release create --draft my-release
          echo "hello world" > OUTFILE
          gh release upload my-release OUTFILE
        }
