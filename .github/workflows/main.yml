on:
  workflow_dispatch:
    inputs:
      upload-assets:
        type: boolean
        default: false

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
    - name: run script
      run: |
        echo "hello world" > OUTFILE

  upload:
    name: Upload
    if: inputs.upload-assets
    needs: generate
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
    - name: run script
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create --draft my-release || true
        gh release upload my-release OUTFILE
