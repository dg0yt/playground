on:
  workflow_dispatch:
    inputs:
      upload-assets:
        type: boolean
        default: false

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
    - name: run script
      run: |
        set -e
        echo "hello world" > OUTFILE
        if test -f .github/WORKFLOW_LABEL && grep -q "vcpkg" .github/WORKFLOW_LABEL
        then
          echo WORKFLOW_LABEL=vcpkg
        else
          echo WORKFLOW_LABEL=mapper
        fi |
          tee -a "$GITHUB_OUTPUT"
        which sdkmanager || true
        echo ":: $SDKMANAGER"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platform;28"
    - name: Save output
      id: save-output
      uses: actions/cache/save@v6
      with:
        path: |
          OUTFILE
        key: 12345

  upload:
    name: Upload
    if: ${{ inputs.upload-assets && vars.ENABLE_UPLOAD != '' }}
    needs: generate
    runs-on: ubuntu-24.04
    environment: Release
    permissions: {}
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
    - name: Restore output
      id: restore-output
      uses: actions/cache/restore@v6
      with:
        path: |
          OUTFILE
        key: 12345
    - name: run script
      env:
        GH_TOKEN: ${{ secrets.MAPPER_VCPKG }}
      run: |
        gh release --repo dg0yt/Mapper-vcpkg create --draft my-release || true
        gh release --repo dg0yt/Mapper-vcpkg upload my-release OUTFILE
